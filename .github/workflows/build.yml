name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Build the full release, as a tag push does"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Whether this run builds what a release ships. A tag push does; so does
  # workflow_dispatch with `full`, which is how the Windows build with the
  # window compiled in gets exercised, and the wxWidgets cache warmed, before
  # the tag exists. Ordinary pushes build the server without wxWidgets, so
  # until this existed the first compile of the GUI on Windows was the release
  # itself. A rehearsal never publishes: the release job below still requires a
  # tag.
  RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full) }}

jobs:
  # Release v0.1.5 shipped assets named 0.1.1 because CMakeLists.txt had not
  # been bumped (issue #17). Fail the build rather than publish a mislabelled
  # release again.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project version matches the tag
        run: |
          project_version=$(sed -n 's/^project(sharefs-server VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "CMakeLists.txt version: ${project_version}"
          if [ -z "${project_version}" ]; then
            echo "::error::Could not read the version from CMakeLists.txt"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "Tag version: ${tag_version}"
            if [ "${project_version}" != "${tag_version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${project_version}. Bump CMakeLists.txt before tagging."
              exit 1
            fi
          fi

  # amd64 and arm64 build identically and differ only in the runner they need,
  # so they are one job with a matrix.
  linux:
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Build
        run: ./build.sh --deb

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: sharefs-linux-${{ matrix.arch }}
          path: releases/linux/${{ matrix.arch }}/
          if-no-files-found: error

      # README.md documents `build.sh --cross-arm64` for building the arm64
      # server from an x86 PC, and the native arm64 job above does not
      # exercise it. Checked here rather than as a job of its own, because the
      # arm64 we ship is the natively built one and this produces nothing.
      - name: Check the documented arm64 cross-compile still works
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          ./build.sh --cross-arm64
          file releases/linux/arm64/sharefs | grep -iE 'aarch64|ARM'

  # x64 cross-compiles with the MinGW in apt. arm64 has no apt toolchain, so it
  # uses llvm-mingw, which ships aarch64-w64-mingw32-* drivers named the way
  # cmake/toolchains/mingw-w64-aarch64.cmake expects. Pinned, because a
  # toolchain that moves under us would change the binaries we ship.
  windows:
    name: windows (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      LLVM_MINGW_VERSION: "20260826"
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip nsis

      - name: Install MinGW (x64, from apt)
        if: matrix.arch == 'x64'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Install llvm-mingw (arm64, not packaged in apt)
        if: matrix.arch == 'arm64'
        run: |
          name="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.tar.xz"
          curl -fsSL "$url" -o /tmp/llvm-mingw.tar.xz
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/${name}/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: ${{ matrix.arch == 'arm64' && 'aarch64-w64-mingw32-gcc' || 'x86_64-w64-mingw32-gcc' }} --version

      - name: Restore wxWidgets cache
        id: wx-cache
        uses: actions/cache@v4
        with:
          path: ~/wxWidgets-mingw-${{ matrix.arch }}/install
          key: wxwidgets-mingw-${{ matrix.arch }}-3.2.4-${{ runner.os }}-${{ env.LLVM_MINGW_VERSION }}
          restore-keys: |
            wxwidgets-mingw-${{ matrix.arch }}-3.2.4-${{ runner.os }}-

      - name: Build wxWidgets for MinGW (first run only)
        if: steps.wx-cache.outputs.cache-hit != 'true' && env.RELEASE_BUILD == 'true'
        run: ./build.sh --windows-wxwidgets --windows-arch ${{ matrix.arch }}

      - name: Build without the window
        if: env.RELEASE_BUILD != 'true'
        run: ./build.sh --windows-only --windows-arch ${{ matrix.arch }} --zip

      - name: Build full release
        if: env.RELEASE_BUILD == 'true'
        run: ./build.sh --windows-only --windows-full --windows-arch ${{ matrix.arch }} --zip

      - name: The full build must contain the window
        if: env.RELEASE_BUILD == 'true'
        run: |
          # --windows-full falls back to a server-only build when wxWidgets is
          # missing, with a warning that is easy to miss in a log. A release
          # must not ship that quietly, and the size is the plainest signal:
          # roughly 600KB without the window, some 13MB with it.
          binary=$(find releases/windows/${{ matrix.arch }} -name 'sharefs.exe' | head -1)
          size=$(wc -c < "$binary")
          echo "sharefs.exe is $size bytes"
          if [ "$size" -lt 3000000 ]; then
            echo "::error::sharefs.exe is $size bytes, which is too small to have wxWidgets in it"
            exit 1
          fi

      - name: Verify the binary targets the right machine
        run: |
          binary=$(find releases/windows/${{ matrix.arch }} -name 'sharefs.exe' | head -1)
          file "$binary"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            file "$binary" | grep -iE 'Aarch64|ARM64'
          else
            file "$binary" | grep -iE 'x86-64|x86_64'
          fi

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: sharefs-windows-${{ matrix.arch }}
          path: releases/windows/${{ matrix.arch }}/
          if-no-files-found: error

  # macOS is built as two single-architecture slices which are then fused into
  # one universal binary, because Homebrew ships wxWidgets per-architecture
  # only. The server itself has no dependencies and could be built universal in
  # one pass; the admin GUI is what forces the two-slice approach.
  #
  # The two slices are one job with a matrix, but they are not symmetrical:
  # free Intel runners are effectively unavailable, so the x86_64 slice is
  # cross-compiled on an Apple Silicon runner. Apple clang emits x86_64 via
  # CMAKE_OSX_ARCHITECTURES; what it needs is x86_64 libraries, which come from
  # a second Homebrew installed under Rosetta into /usr/local. Hence the extra
  # steps that run for that arch alone.
  macos:
    name: macos (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install dependencies
        if: matrix.arch == 'arm64'
        run: |
          brew update
          brew install cmake wxwidgets
          brew list --versions wxwidgets

      - name: Install x86_64 Homebrew and dependencies
        if: matrix.arch == 'x86_64'
        timeout-minutes: 20
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            script="$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$script"
          fi
          # Both slices must carry the SAME version of every library: lipo
          # fuses them into one file, and two upstream releases are not one
          # library. "brew update" is what holds the two independent Homebrews
          # to the same formula revision.
          for attempt in 1 2 3; do
            arch -x86_64 /usr/local/bin/brew update && break
            echo "brew update failed (attempt $attempt of 3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          arch -x86_64 /usr/local/bin/brew install cmake wxwidgets
          arch -x86_64 /usr/local/bin/brew list --versions wxwidgets

      - name: Build slice
        run: |
          # For x86_64, resolve wx-config and cmake from the x86_64 Homebrew so
          # the slice links x86_64 libraries.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            export PATH="/usr/local/bin:$PATH"
          fi
          ./build-macos.sh --arch ${{ matrix.arch }}

      - name: Run tests
        # The arm64 slice is the one this runner can execute.
        if: matrix.arch == 'arm64'
        run: ctest --test-dir build-mac-${{ matrix.arch }} --output-on-failure

      - name: Upload slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-slice-${{ matrix.arch }}
          # The staged tree, not just the binary: it carries the bundled
          # libraries, which only exist on this runner.
          path: build-mac-${{ matrix.arch }}/appstage/
          if-no-files-found: error

  macos-universal:
    # Fuse the slices and package the release. Installs no dependencies of its
    # own: everything it needs came from the two slice jobs.
    needs: [macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-slice-arm64
          path: build-mac-arm64/appstage

      - name: Download x86_64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-slice-x86_64
          path: build-mac-x86_64/appstage

      - name: Restore permissions
        # Artifact upload does not preserve the executable bit.
        run: |
          chmod +x build-mac-*/appstage/ShareFS.app/Contents/MacOS/ShareFS

      - name: Fuse into a universal build
        run: ./build-macos.sh --fuse --zip --dmg

      - name: Verify the result is universal and self-contained
        run: |
          # One binary now: ShareFS.app is the whole product, and the command
          # line lives inside it at Contents/MacOS/ShareFS.
          app=releases/macos/ShareFS.app/Contents/MacOS/ShareFS
          lipo -archs "$app"
          lipo -archs "$app" | grep -q x86_64
          lipo -archs "$app" | grep -q arm64
          # Nothing may point back at a Homebrew prefix that users will not have.
          if otool -L "$app" | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::ShareFS.app still references Homebrew paths"
            exit 1
          fi
          # It must actually run on this machine, and the same binary must
          # answer the command line rather than trying to open a window.
          "$app" --version
          "$app" --help > /dev/null

      - name: Upload macOS universal release
        uses: actions/upload-artifact@v4
        with:
          name: sharefs-macos-universal
          path: |
            releases/*.zip
            releases/*.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, linux, windows, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: sharefs-linux-amd64
          path: release-assets/linux-amd64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: sharefs-linux-arm64
          path: release-assets/linux-arm64

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: sharefs-windows-x64
          path: release-assets/windows-x64

      - name: Download Windows arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: sharefs-windows-arm64
          path: release-assets/windows-arm64

      - name: Download macOS universal artifact
        uses: actions/download-artifact@v4
        with:
          name: sharefs-macos-universal
          path: release-assets/macos

      - name: Collect release assets
        run: |
          mkdir -p upload
          shopt -s nullglob
          cp release-assets/linux-amd64/*.deb upload/
          cp release-assets/linux-arm64/*.deb upload/
          cp release-assets/windows-x64/*.zip upload/
          cp release-assets/windows-x64/*-setup.exe upload/
          cp release-assets/windows-arm64/*.zip upload/
          cp release-assets/windows-arm64/*-setup.exe upload/
          # One binary per architecture, not a server and an admin: see
          # src/cli.h. Published loose as well as in the .deb for anyone who
          # wants to drop it onto a machine without a package manager.
          cp release-assets/linux-amd64/sharefs upload/sharefs-linux-amd64
          cp release-assets/linux-arm64/sharefs upload/sharefs-linux-arm64
          cp release-assets/macos/*.zip upload/
          cp release-assets/macos/*.dmg upload/
          ls -la upload/
          # Every architecture must contribute a distinct file. A collision
          # here would publish one arch's build under both names.
          expected=$(ls release-assets/*/*.zip release-assets/*/*-setup.exe \
                        release-assets/*/*.deb release-assets/*/*.dmg 2>/dev/null | wc -l)
          actual=$(ls upload/*.zip upload/*-setup.exe upload/*.deb upload/*.dmg 2>/dev/null | wc -l)
          if [ "$expected" != "$actual" ]; then
            echo "::error::collected $actual packaged assets from $expected inputs; names must collide"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
